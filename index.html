<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERTEX LIT (PRIVATE) LIMITED</title>
  <meta name="description" content="VERTEX LIT (PRIVATE) LIMITED">
  <meta name="theme-color" content="#00897B">
  <style>
    :root {
      --primary: #00897B;
      --primary-dark: #00695C;
      --primary-deep: #004D40;
      --accent: #FFC233;
      --text: #1C1B1F;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      background: linear-gradient(165deg, #00A392 0%, #00796B 52%, var(--primary-deep) 100%);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      overflow-wrap: break-word;
    }

    h1::after {
      content: "";
      display: block;
      width: 56px;
      height: 4px;
      margin: 20px auto 0;
      border-radius: 2px;
      background: var(--accent);
    }

    .button {
      display: inline-block;
      min-width: 200px;
      padding: 15px 32px;
      border-radius: 999px;
      background: #fff;
      color: var(--primary-dark);
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(0, 40, 35, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .button:hover {
      background: #F1FAF8;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 40, 35, 0.35);
    }

    .button:active { transform: translateY(0); }

    .button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    @media (max-width: 400px) {
      .button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
      .button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>VERTEX LIT (PRIVATE) LIMITED</h1>
    <a class="button" href="life-bucket-list-privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
  </main>
</body>
</html>
